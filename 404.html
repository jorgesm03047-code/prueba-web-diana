<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="error-page">
    <div class="error-page__content">
      <div class="error-page__illustration" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M16 16s-1.5-2-4-2-4 2-4 2"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/>
          <line x1="15" y1="9" x2="15.01" y2="9"/>
        </svg>
      </div>

      <div class="error-page__code" aria-hidden="true">404</div>
      <h1 class="error-page__title">Página no encontrada</h1>
      <p class="error-page__text">Lo sentimos, la página que busca no existe, ha sido movida o no está disponible en este momento. Verifique que la dirección sea correcta o regrese al inicio del portal.</p>

      <div class="error-page__actions">
        <a href="index.html" class="btn btn--primary">
          Volver al Inicio
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <a href="contacto.html" class="btn btn--outline">
          Contactar
        </a>
      </div>

      <nav style="margin-top:var(--space-3xl);padding-top:var(--space-xl);border-top:1px solid var(--color-border-light)" aria-label="Navegación alternativa">
        <p style="font-size:.8125rem;color:var(--color-text-light);margin-bottom:var(--space-md)">También puede visitar:</p>
        <div style="display:flex;flex-wrap:wrap;gap:var(--space-md);justify-content:center">
          <a href="trayectoria.html" style="font-size:.8125rem;font-weight:500;color:var(--color-lavender-text);padding:.375rem .75rem;background:var(--color-lavender);border-radius:var(--radius-full);transition:opacity .2s">Trayectoria</a>
          <a href="especialidades.html" style="font-size:.8125rem;font-weight:500;color:var(--color-mint-text);padding:.375rem .75rem;background:var(--color-mint);border-radius:var(--radius-full);transition:opacity .2s">Especialidades</a>
          <a href="divulgacion.html" style="font-size:.8125rem;font-weight:500;color:var(--color-sky-text);padding:.375rem .75rem;background:var(--color-sky);border-radius:var(--radius-full);transition:opacity .2s">Publicaciones</a>
